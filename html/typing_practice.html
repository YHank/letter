<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <h2 class="mb-4">한글 타자 연습</h2>
            
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">연습 모드 선택</h5>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-outline-primary active" data-mode="words">단어 연습</button>
                                <button type="button" class="btn btn-outline-primary" data-mode="sentences">문장 연습</button>
                                <button type="button" class="btn btn-outline-primary" data-mode="paragraph">문단 연습</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">난이도</h5>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-outline-success active" data-level="easy">쉬움</button>
                                <button type="button" class="btn btn-outline-warning" data-level="medium">보통</button>
                                <button type="button" class="btn btn-outline-danger" data-level="hard">어려움</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 타자 연습 영역 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div id="typing-text" class="fs-4 mb-4 p-3 bg-light rounded">
                        <span id="typed-text" class="text-success"></span><span id="current-char" class="bg-primary text-white"></span><span id="remaining-text"></span>
                    </div>
                    
                    <div class="mb-3">
                        <input type="text" id="typing-input" class="form-control form-control-lg" placeholder="위 텍스트를 입력하세요..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <button id="start-btn" class="btn btn-success">시작</button>
                        <button id="reset-btn" class="btn btn-secondary">다시하기</button>
                        <button id="next-btn" class="btn btn-primary" style="display: none;">다음 문제</button>
                    </div>
                </div>
            </div>
            
            <!-- 실시간 통계 -->
            <div class="row">
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">타수</h5>
                            <h2 id="wpm" class="text-primary">0</h2>
                            <small>타/분</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">정확도</h5>
                            <h2 id="accuracy" class="text-success">100%</h2>
                            <small>정확도</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">시간</h5>
                            <h2 id="time" class="text-info">0:00</h2>
                            <small>경과 시간</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">진행률</h5>
                            <h2 id="progress" class="text-warning">0%</h2>
                            <small>완료</small>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 결과 모달 -->
            <div class="modal fade" id="resultModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">타자 연습 결과</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="text-center">
                                <h3 class="mb-4">수고하셨습니다!</h3>
                                <div class="row">
                                    <div class="col-6">
                                        <h5>최종 타수</h5>
                                        <h2 id="final-wpm" class="text-primary">0</h2>
                                    </div>
                                    <div class="col-6">
                                        <h5>최종 정확도</h5>
                                        <h2 id="final-accuracy" class="text-success">0%</h2>
                                    </div>
                                </div>
                                <hr>
                                <p id="result-message" class="mt-3"></p>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                            <button type="button" class="btn btn-primary" onclick="location.reload()">다시 연습</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
