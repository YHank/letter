<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <h2 class="mb-4">한글 맞춤법 검사기 (네이버)</h2>
            
            <div class="alert alert-info">
                <strong>안내:</strong> 이 맞춤법 검사기는 네이버 맞춤법 검사기를 활용합니다.
                <br>최대 500자까지 한 번에 검사할 수 있습니다.
            </div>
            
            <div class="mb-3">
                <label for="spellcheck_input_naver" class="form-label">검사할 텍스트를 입력하세요:</label>
                <textarea id="spellcheck_input_naver" class="form-control" rows="10" placeholder="맞춤법을 검사할 텍스트를 입력하세요..." maxlength="500"></textarea>
                <div class="d-flex justify-content-between mt-1">
                    <small class="form-text text-muted">현재 글자수: <span id="char_count">0</span> / 500</small>
                </div>
            </div>
            
            <div class="d-flex gap-2 mb-4">
                <button id="check_spelling_naver_btn" class="btn btn-primary">맞춤법 검사</button>
                <button id="clear_text_naver_btn" class="btn btn-outline-secondary">지우기</button>
                <button id="copy_result_btn" class="btn btn-outline-success" style="display: none;">결과 복사</button>
            </div>
            
            <div id="spellcheck_results_naver" style="display: none;">
                <!-- 검사 결과가 여기에 표시됩니다 -->
            </div>
        </div>
    </div>
    
    <div class="row justify-content-center mt-5">
        <div class="col-12 col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">맞춤법 검사 팁</h5>
                    <ul class="mb-0">
                        <li>한 번에 500자까지 검사할 수 있습니다.</li>
                        <li>긴 문서는 여러 번 나누어 검사하세요.</li>
                        <li>검사 결과는 참고용으로만 사용하세요.</li>
                        <li>문맥에 따라 맞춤법이 달라질 수 있습니다.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 동적 로딩을 위해 즉시 실행
(function() {
    const inputArea = document.getElementById('spellcheck_input_naver');
    const charCountSpan = document.getElementById('char_count');
    const checkBtn = document.getElementById('check_spelling_naver_btn');
    const clearBtn = document.getElementById('clear_text_naver_btn');
    const copyBtn = document.getElementById('copy_result_btn');
    const resultsDiv = document.getElementById('spellcheck_results_naver');
    
    // 글자수 카운트
    inputArea.addEventListener('input', function() {
        const count = this.value.length;
        charCountSpan.textContent = count;
        
        if (count > 500) {
            this.value = this.value.substring(0, 500);
            charCountSpan.textContent = 500;
        }
    });
    
    // 맞춤법 검사
    checkBtn.addEventListener('click', function() {
        const text = inputArea.value.trim();
        if (!text) {
            alert('검사할 텍스트를 입력해주세요.');
            return;
        }
        
        // 네이버 맞춤법 검사기 페이지로 이동
        const naverUrl = 'https://search.naver.com/search.naver?where=nexearch&sm=top_hty&fbm=0&ie=utf8&query=' + encodeURIComponent('맞춤법 검사 ' + text);
        
        resultsDiv.innerHTML = `
            <div class="alert alert-warning">
                <h5>네이버 맞춤법 검사기 사용 방법</h5>
                <ol>
                    <li>아래 버튼을 클릭하면 네이버 맞춤법 검사 페이지가 새 창으로 열립니다.</li>
                    <li>검사 결과를 확인하고 수정된 텍스트를 복사하세요.</li>
                    <li>이 페이지로 돌아와서 수정된 텍스트를 붙여넣기 하세요.</li>
                </ol>
                <a href="${naverUrl}" target="_blank" class="btn btn-success mt-2">네이버에서 맞춤법 검사하기</a>
            </div>
        `;
        resultsDiv.style.display = 'block';
    });
    
    // 지우기
    clearBtn.addEventListener('click', function() {
        inputArea.value = '';
        charCountSpan.textContent = '0';
        resultsDiv.style.display = 'none';
        copyBtn.style.display = 'none';
    });
    
    // 복사
    copyBtn.addEventListener('click', function() {
        inputArea.select();
        document.execCommand('copy');
        
        const originalText = this.textContent;
        this.textContent = '복사됨!';
        setTimeout(() => {
            this.textContent = originalText;
        }, 2000);
    });
})();
</script>
