<div class="container mt-5">
    <h2>맞춤법 검사기 (Spell Checker)</h2>
    <p>아래 입력란에 텍스트를 입력하고 "맞춤법 검사하기" 버튼을 클릭하면 맞춤법 및 문법 오류를 검사합니다.</p>

    <textarea id="spellcheck_input" rows="10" style="width: 100%;" placeholder="여기에 검사할 텍스트를 입력하세요..."></textarea>

    <h3 class="mt-4">검사 결과:</h3>
