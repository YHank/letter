<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맞춤법 API 테스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>한글 맞춤법 검사 API 테스트</h1>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <h3>테스트 입력</h3>
                <textarea id="testInput" class="form-control" rows="5">안녕하세요. 맞춤법 검사를 테스트 합니다. 일부러 틀린 맞춤법을 넣어봤읍니다.</textarea>
                <button id="testBtn" class="btn btn-primary mt-2">API 테스트</button>
                <button id="corsProxyBtn" class="btn btn-warning mt-2">CORS Proxy 테스트</button>
            </div>
            
            <div class="col-md-6">
                <h3>테스트 결과</h3>
                <div id="results" class="border rounded p-3" style="min-height: 200px; background-color: #f8f9fa;">
                    결과가 여기에 표시됩니다...
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <h3>콘솔 로그</h3>
            <div id="console" class="border rounded p-3 bg-dark text-light" style="height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px;">
            </div>
        </div>
    </div>

    <script>
        const resultsDiv = document.getElementById('results');
        const consoleDiv = document.getElementById('console');
        const testInput = document.getElementById('testInput');
        
        // 콘솔 로그 캡처
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'text-danger' : type === 'success' ? 'text-success' : 'text-info';
            consoleDiv.innerHTML += `<div class="${color}">[${time}] ${message}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }
        
        // 직접 API 호출 테스트
        document.getElementById('testBtn').addEventListener('click', async () => {
            const text = testInput.value;
            log('직접 API 호출 시작...');
            resultsDiv.innerHTML = '<div class="spinner-border" role="status"></div> 검사 중...';
            
            try {
                const formData = new FormData();
                formData.append('text1', text);
                
                log('요청 전송: https://nara-speller.co.kr/speller/spell_check.do');
                
                const response = await fetch('https://nara-speller.co.kr/speller/spell_check.do', {
                    method: 'POST',
                    body: formData
                });
                
                log(`응답 상태: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const responseText = await response.text();
                    log('응답 받음, 길이: ' + responseText.length);
                    
                    // 응답에서 결과 추출 시도
                    const match = responseText.match(/var\s+aResult\s*=\s*(\[[\s\S]*?\]);/);
                    if (match) {
                        log('결과 데이터 발견!', 'success');
                        resultsDiv.innerHTML = '<pre>' + match[1].substring(0, 500) + '...</pre>';
                    } else {
                        log('결과 데이터를 찾을 수 없음', 'error');
                        resultsDiv.innerHTML = '<div class="text-danger">파싱 실패</div>';
                    }
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
                
            } catch (error) {
                log('오류 발생: ' + error.message, 'error');
                resultsDiv.innerHTML = `<div class="alert alert-danger">
                    <strong>오류:</strong> ${error.message}<br>
                    <small>CORS 정책으로 인해 직접 호출이 차단되었을 수 있습니다.</small>
                </div>`;
            }
        });
        
        // CORS Proxy를 통한 테스트
        document.getElementById('corsProxyBtn').addEventListener('click', async () => {
            const text = testInput.value;
            log('CORS Proxy를 통한 호출 시작...');
            resultsDiv.innerHTML = '<div class="spinner-border" role="status"></div> 검사 중...';
            
            // 공개 CORS 프록시 서비스들
            const proxies = [
                'https://cors-anywhere.herokuapp.com/',
                'https://api.allorigins.win/raw?url=',
                'https://corsproxy.io/?'
            ];
            
            for (const proxy of proxies) {
                try {
                    log(`프록시 시도: ${proxy}`);
                    
                    const targetUrl = 'https://nara-speller.co.kr/speller/spell_check.do';
                    const proxyUrl = proxy + encodeURIComponent(targetUrl);
                    
                    // FormData를 사용할 수 없으므로 URL 인코딩된 형태로 전송
                    const params = new URLSearchParams();
                    params.append('text1', text);
                    
                    const response = await fetch(proxyUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: params.toString()
                    });
                    
                    if (response.ok) {
                        log(`${proxy} 성공!`, 'success');
                        const responseText = await response.text();
                        resultsDiv.innerHTML = '<div class="alert alert-success">프록시 통신 성공!</div>';
                        break;
                    }
                } catch (error) {
                    log(`${proxy} 실패: ${error.message}`, 'error');
                }
            }
        });
        
        // 초기 로그
        log('맞춤법 API 테스트 준비 완료');
        log('부산대학교 API: https://nara-speller.co.kr');
    </script>
</body>
</html>
